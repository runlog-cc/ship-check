name: RunLog Ship-Check
description: Validate recorded JSON scenario evidence and require an explicit remote APPROVED verdict.
author: RunLog
branding:
  icon: shield
  color: orange
inputs:
  token:
    description: RunLog API key
    required: true
  scenarios:
    description: Path to version 1 JSON assertion suite
    required: true
  trace:
    description: Path to recorded candidate JSON trace array
    required: true
  baseline-trace:
    description: Optional recorded baseline trace array
    required: false
  api-url:
    description: HTTPS gate endpoint (receives the API key and trace)
    default: https://runlog.cc/api/v1/gate
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Evaluate recorded evidence
      shell: bash
      env:
        RUNLOG_TOKEN: ${{ inputs.token }}
        SCENARIOS_PATH: ${{ inputs.scenarios }}
        TRACE_PATH: ${{ inputs.trace }}
        BASELINE_PATH: ${{ inputs.baseline-trace }}
        RUNLOG_GATE_URL: ${{ inputs.api-url }}
        ACTION_PATH: ${{ github.action_path }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        args=(--scenarios "$SCENARIOS_PATH" --trace "$TRACE_PATH")
        if [[ -n "$BASELINE_PATH" ]]; then
          args+=(--baseline-trace "$BASELINE_PATH")
        fi
        python "$ACTION_PATH/runner.py" "${args[@]}"
