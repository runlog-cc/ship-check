# Copy to .github/workflows/ship-check.yml. This demonstrates a real local tool,
# not your application's evaluator. Replace the harness before release gating.
name: Ship-Check demo
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recorded-assertions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: runlog-cc/ship-check
          ref: v0.2.0
          path: .ship-check
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Execute the local demo tool (no secrets)
        run: python .ship-check/examples/harness.py --output .runlog
      - uses: runlog-cc/ship-check@v0.2.0
        with:
          offline: 'true'
          scenarios: .runlog/suite.json
          trace: .runlog/trace.json
  signed-trace-policy:
    # No secrets or privileged job on pull requests, including forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: recorded-assertions
    runs-on: ubuntu-latest
    environment: runlog-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: runlog-cc/ship-check
          ref: v0.2.0
          path: .ship-check
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read trusted commit context
        id: commits
        shell: bash
        run: |
          parent_commit="$(git rev-parse HEAD^)"
          echo "base_sha=$parent_commit" >> "$GITHUB_OUTPUT"
      - name: Execute demo tool and bind records to this protected commit
        env:
          EXPECTED_BASE: ${{ steps.commits.outputs.base_sha }}
        run: |
          python .ship-check/examples/harness.py --output .runlog \
            --repo "$GITHUB_REPOSITORY" --head-sha "$GITHUB_SHA" --base-sha "$EXPECTED_BASE" \
            --workflow .github/workflows/ship-check.yml
      - name: Load independently provisioned issuer public key
        env:
          ISSUER_JWK: ${{ vars.RUNLOG_GATE_PUBLIC_JWK }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('.runlog/issuer.json').write_text(os.environ['ISSUER_JWK'])
          PY
      - uses: runlog-cc/ship-check@v0.2.0
        with:
          token: ${{ secrets.RUNLOG_API_KEY }}
          evaluation-evidence: .runlog/evidence.json
          evaluation-suite: .runlog/suite.json
          evaluation-workflow: .github/workflows/ship-check.yml
          evaluation-report: .runlog/report.json
          issuer-public-key: .runlog/issuer.json
          expected-issuer: https://runlog.cc
          expected-repo: ${{ github.repository }}
          expected-head-sha: ${{ github.sha }}
          expected-base-sha: ${{ steps.commits.outputs.base_sha }}
