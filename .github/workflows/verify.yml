name: Offline checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recorded-assertions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test local parsing, assertions and evidence contracts
        run: python -m unittest discover -s tests
      - name: Exercise actual passing and failing offline CLI paths
        shell: bash
        run: |
          demo_dir="$(mktemp -d)"
          python examples/harness.py --output "$demo_dir"
          python runner.py --offline --scenarios "$demo_dir/suite.json" --trace "$demo_dir/trace.json"
          python examples/harness.py --output "$demo_dir" --fail
          set +e
          python runner.py --offline --scenarios "$demo_dir/suite.json" --trace "$demo_dir/trace.json"
          checker_status=$?
          set -e
          test "$checker_status" -eq 1
